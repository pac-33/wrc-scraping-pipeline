name: wrc-pipeline

services:
  mongodb:
    image: mongo:8.0.13
    restart: unless-stopped
    ports:
      # Host ports are env-configurable so the stack coexists with other
      # local services (e.g. a native mongod already bound to 27017).
      - "${WRC_MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # `ping` is allowed pre-auth, so no credentials leak into the healthcheck.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${WRC_MINIO_HOST_PORT:-9000}:9000" # S3 API
      - "${WRC_MINIO_CONSOLE_HOST_PORT:-9001}:9001" # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot bucket bootstrap; the server image bundles the mc client, so no
  # separate (and separately-versioned) mc image is needed.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/$${WRC_LANDING_BUCKET:-wrc-landing} local/$${WRC_CURATED_BUCKET:-wrc-curated}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      WRC_LANDING_BUCKET: ${WRC_OBJECT_STORE__LANDING_BUCKET:-wrc-landing}
      WRC_CURATED_BUCKET: ${WRC_OBJECT_STORE__CURATED_BUCKET:-wrc-curated}

  # --- Dagster stack (opt-in): docker compose --profile dagster up -d --------
  dagster-postgres:
    image: postgres:16.9-alpine
    profiles: ["dagster"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    volumes:
      - dagster-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAGSTER_POSTGRES_USER:-dagster}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Code location gRPC server; runs also execute here (default run launcher),
  # so this container needs the app env (Mongo/MinIO via the compose network).
  wrc-code:
    build: .
    profiles: ["dagster"]
    restart: unless-stopped
    command: dagster code-server start -h 0.0.0.0 -p 4000 -m wrc_pipeline.orchestration.definitions
    environment: &wrc_app_env
      WRC_MONGO__URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
      WRC_MONGO__DATABASE: ${WRC_MONGO__DATABASE:-wrc}
      WRC_OBJECT_STORE__ENDPOINT_URL: http://minio:9000
      WRC_OBJECT_STORE__ACCESS_KEY: ${MINIO_ROOT_USER}
      WRC_OBJECT_STORE__SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      WRC_SCRAPER__CONTACT_EMAIL: ${WRC_SCRAPER__CONTACT_EMAIL:?set in .env}
      WRC_PARTITIONS_START: ${WRC_PARTITIONS_START:-2024-01-01}
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?set in .env}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      dagster-postgres:
        condition: service_healthy

  dagster-webserver:
    build: .
    profiles: ["dagster"]
    restart: unless-stopped
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/home/workspace.yaml
    ports:
      - "${WRC_DAGSTER_HOST_PORT:-3000}:3000"
    environment: *wrc_app_env
    depends_on:
      dagster-postgres:
        condition: service_healthy
      wrc-code:
        condition: service_started

  dagster-daemon:
    build: .
    profiles: ["dagster"]
    restart: unless-stopped
    command: dagster-daemon run -w /opt/dagster/home/workspace.yaml
    environment: *wrc_app_env
    depends_on:
      dagster-postgres:
        condition: service_healthy
      wrc-code:
        condition: service_started

volumes:
  mongo-data:
  minio-data:
  dagster-postgres-data:
