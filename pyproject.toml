[project]
name = "wrc-pipeline"
version = "0.1.0"
description = "Scraping pipeline for workplacerelations.ie decisions: Scrapy ingestion, MongoDB metadata, MinIO document storage, Dagster orchestration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "scrapy>=2.18,<2.19",
    "pymongo>=4.17,<5",
    "boto3>=1.40,<2",
    "beautifulsoup4>=4.13,<5",
    "lxml>=5.3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "structlog>=25.1,<27",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "mongomock>=4.3",
    "moto[s3]>=5.2",
    "boto3-stubs[s3]>=1.40",
    "ruff>=0.14",
    "mypy>=1.14",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return style
    "PTH",  # pathlib
    "RUF",  # ruff-specific
    "T20",  # no stray print()
    "DTZ",  # naive datetimes
    "PT",   # pytest idioms
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["wrc_pipeline"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scrapy.*", "mongomock.*", "moto.*", "botocore.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires the docker compose services (mongo + minio)",
]
